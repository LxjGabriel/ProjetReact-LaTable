version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: resa_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=resa_db
    volumes:
      - ./backend/init-db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: resa_api
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: resa_db
      DB_PORT: 5432
      NODE_ENV: development
      SECRET_KEY: 1234567890123432
    volumes:
      - ./backend:/app
      - /app/node_modules
  
  frontend:
    build: ./frontend
    container_name: resa_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      SECRET_KEY: 1234567890123432
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: