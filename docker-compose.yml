version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: resa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: resa_db
      MYSQL_USER: resauser
      MYSQL_PASSWORD: resapass
    ports:
      - "3306:3306"
    volumes:
      - ./backend/init-db:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  api:
    build: ./backend
    container_name: task_manager_api
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: taskuser
      DB_PASSWORD: taskpass
      DB_NAME: tasks_manager
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mysql_data: